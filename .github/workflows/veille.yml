name: Veille alternance

on:
  schedule:
    # Minutes décalées : GitHub sature à l'heure pile et aux multiples de 5.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m veille
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LBA_API_KEY: ${{ secrets.LBA_API_KEY }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Enregistre les offres
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add docs/data/offers.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour des offres"
          # Le push échoue parfois : erreur transitoire côté GitHub
          # ("fatal error in commit_refs") ou main a bougé entre-temps
          # ("fetch first"). On rebase puis on réessaie.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push refusé (tentative $i), nouvel essai dans $((i * 5)) s"
            sleep $((i * 5))
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
